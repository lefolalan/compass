# West manifest, T2 topology. This directory is the manifest repository.
#
# Zephyr is pinned on a main SHA because no release ships both the
# adafruit_feather_esp32c6 board and the solomon,ssd1683 display support yet.
# Move the pin to v4.5.0 once it is tagged.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: 52b48529aecc3ad0ef9b159996bdb5d2b3e5b794
      import:
        # Only the modules this firmware needs. Add lvgl, mbedtls, ... here
        # when a feature requires them.
        name-allowlist:
          - hal_espressif

  self:
    path: firmware
