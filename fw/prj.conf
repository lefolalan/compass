CONFIG_DISPLAY=y
CONFIG_LOG=y

# Wi-Fi station. The credentials come from wifi.conf, see wifi.conf.example.
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# The Wi-Fi events carry their status in the event info.
CONFIG_NET_MGMT_EVENT_INFO=y

# Frame upload server.
CONFIG_NET_SOCKETS=y
# A stalled client must time out, see upload_server.c.
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NANOPB=y
# main() runs the server, which decodes the request and refreshes the panel.
CONFIG_MAIN_STACK_SIZE=4096
